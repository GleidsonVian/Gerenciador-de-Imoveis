{% extends "base.html" %}
{% block content %}
<h2>Novo Pagamento</h2>
<form method="post" class="mt-3" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Inquilino</label>
        <select name="inquilino_id" class="form-select" required>
            <option value="">-- Selecione --</option>
            {% for inquilino in inquilinos %}
            <option value="{{ inquilino.id }}">
                {{ inquilino.nome }} — {{ inquilino.imovel.endereco if inquilino.imovel else "sem imóvel" }}
            </option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Valor</label>
        <input type="number" step="0.01" name="valor" class="form-control" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Data de Vencimento</label>
        <input type="date" name="data_vencimento" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/pagamentos/" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
