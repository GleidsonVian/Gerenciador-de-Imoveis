{% extends "base.html" %}
{% block content %}
<h2>{% if inquilino %}Editar{% else %}Novo{% endif %} Inquilino</h2>
{% if erro %}
<div class="alert alert-danger mt-2">{{ erro }}</div>
{% endif %}
<form method="post" class="mt-3" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" value="{{ inquilino.nome if inquilino else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">CPF</label>
        <input type="text" name="cpf" class="form-control" value="{{ inquilino.cpf if inquilino else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ inquilino.email if inquilino else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control" value="{{ inquilino.telefone if inquilino else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Imóvel</label>
        <select name="imovel_id" class="form-select">
            <option value="">-- Nenhum --</option>
            {% for imovel in imoveis %}
            <option value="{{ imovel.id }}" {% if inquilino and inquilino.imovel_id == imovel.id %}selected{% endif %}>
                {{ imovel.endereco }} (R$ {{ "%.2f"|format(imovel.valor_aluguel) }})
            </option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/inquilinos/" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
