{% extends "base.html" %}
{% block content %}
<h2>{% if imovel %}Editar{% else %}Novo{% endif %} Imóvel</h2>
<form method="post" class="mt-3" style="max-width: 500px;">
    <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input type="text" name="endereco" class="form-control" value="{{ imovel.endereco if imovel else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select" required>
            <option value="casa" {% if imovel and imovel.tipo == 'casa' %}selected{% endif %}>Casa</option>
            <option value="apartamento" {% if imovel and imovel.tipo == 'apartamento' %}selected{% endif %}>Apartamento</option>
            <option value="comercial" {% if imovel and imovel.tipo == 'comercial' %}selected{% endif %}>Comercial</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Valor do Aluguel</label>
        <input type="number" step="0.01" name="valor_aluguel" class="form-control" value="{{ imovel.valor_aluguel if imovel else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Status</label>
        <select name="status" class="form-select">
            <option value="disponivel" {% if imovel and imovel.status == 'disponivel' %}selected{% endif %}>Disponível</option>
            <option value="alugado" {% if imovel and imovel.status == 'alugado' %}selected{% endif %}>Alugado</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea name="descricao" class="form-control">{{ imovel.descricao if imovel else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="/imoveis/" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
